description = "Teams bot — thin conversational channel over the Bench service (ADR 0004)"
requires-python = ">=3.12,<3.14"
dependencies = [
  "microsoft-teams-apps>=2.0.0a8,<3.0.0",
  "azure-identity>=1.12.0",
