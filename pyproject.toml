[project]
name = "onboarding-agentcore-workshop"
version = "0.1.0"
description = "Workshop MVP for developer onboarding with Strands Agents and Amazon Bedrock AgentCore"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0.2",
  "pydantic>=2.8.0",
  # Bench domain daily cycle (local-only, no AWS required) — see docs/adr/0002
  "langgraph>=0.2",
  # Loads repo-root .env (flags + AWS/Bedrock config) in bench/config.py
  "python-dotenv>=1.0",
  # Endava Profile PDF text extraction
  "pypdf>=4.0",
]

[project.optional-dependencies]
# Lab 2 / real agents (requires AWS credentials + Bedrock model access)
agents = [
  "strands-agents",
  "bedrock-agentcore",
]
# Conversational agent (bench/agent_graph.py): LLM bound to tools + chat memory
agentic = [
  "langchain>=1.0",
  "langchain-aws>=0.2",
  "langgraph-checkpoint-sqlite>=2.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "moto>=5.0",
  "boto3>=1.34",
]
# Dev web UI (bench/webapp.py)
ui = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
